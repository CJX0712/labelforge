[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labelforge"
version = "0.1.0"
description = "LabelForge · 弱监督 / 程序化标注标签模型系统（纯 numpy Dawid-Skene EM + AdaWS 聚合）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = ["weak-supervision", "data-programming", "label-model", "dawid-skene", "snorkel", "noisy-labels"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
dev = ["pytest>=7.0"]

[project.scripts]
labelforge = "labelforge.cli:main"

[tool.setuptools]
packages = [
    "labelforge",
    "labelforge.core",
    "labelforge.data",
    "labelforge.labelmodel",
    "labelforge.eval",
    "labelforge.pipeline",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
